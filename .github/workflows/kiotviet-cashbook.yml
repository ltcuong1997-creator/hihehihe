# Robot KiotViet — TẢI SỔ QUỸ theo yêu cầu (chạy tay). Repo công khai: không in tiền ra log; file xuất
# được mã hoá bằng khoá công khai truyền vào (pubkey) nên trên GitHub chỉ có bản mã.
name: Robot KiotViet – tải sổ quỹ
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'discover = dò API trang Sổ quỹ · export = tải và mã hoá'
        default: discover
      from:
        description: 'Từ ngày YYYY-MM-DD'
        default: ''
      to:
        description: 'Đến ngày YYYY-MM-DD'
        default: ''
      pubkey:
        description: 'Khoá công khai RSA (PEM, base64 một dòng) để mã hoá file xuất'
        default: ''
permissions:
  contents: write
concurrency:
  group: kiotviet-sync
  cancel-in-progress: false
jobs:
  cashbook:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: robot/kiotviet-sync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: robot/kiotviet-sync/package-lock.json
      - run: npm ci
      - name: Cache trình duyệt Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('robot/kiotviet-sync/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - name: Sổ quỹ KiotViet
        env:
          KV_SHOP: ${{ secrets.KV_SHOP || 'hihecf' }}
          KV_USER: ${{ secrets.KV_USER }}
          KV_PASS: ${{ secrets.KV_PASS }}
          MODE: ${{ github.event.inputs.mode }}
          FROM: ${{ github.event.inputs.from }}
          TO: ${{ github.event.inputs.to }}
          PUBKEY: ${{ github.event.inputs.pubkey }}
        run: node cashbook.mjs
